name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall -q app dashboard scripts

      - name: Validate required project files
        run: |
          test -f app/config.py
          test -f app/db.py
          test -f app/learning.py
          test -f app/ollama_client.py
          test -f app/reply.py
          test -f dashboard/app.py
          test -f scripts/evaluate_agent.py
          test -d knowledge_base
